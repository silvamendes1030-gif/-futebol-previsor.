name: Atualizar jogos
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Atualizar
        run: python atualizar_jogos.py
     import os

API_KEY = os.getenv("FOOTBALL_DATA_TOKEN")   
      - name: Guardar alteracoes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add jogos.json jogos.csv jogos.ics
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar jogos"
            git push
          fi
